[package]
name = "oracle"
version = "0.1.0"
description = "Command center for your projects"
authors = ["Alicien"]
edition = "2021"
rust-version = "1.88"

[dependencies]
# Windowing and GPU
winit = "0.30"
wgpu = { version = "30", features = ["wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Text
glyphon = "0.12"

# Icons
resvg = { version = "0.48", default-features = false }

# Motion and glass
glisten-motion = { path = "../../glisten/crates/glisten-motion" }
glisten-glass = { path = "../../glisten/crates/glisten-glass" }

# Backend, carried over unchanged from the Tauri build
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "charset"] }
sysinfo = "0.38"
dirs = "7"
chrono = "0.4"
parking_lot = "0.12"
tray-icon = "0.24.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "oracle"
version = "0.1.1"
description = "Command center for your projects"
authors = ["Alicien"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "oracle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "charset"] }
sysinfo = "0.38.4"
dirs = "7.0.0"
chrono = "0.4.45"
parking_lot = "0.12.5"
window-vibrancy = "0.8.0"
tauri-plugin-dialog = "2.7.3"
# Self-update, and the restart that has to follow an install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
